{% extends 'core/base.html' %}

{% block content %}

<!-- FLOATING CHAT BUTTON -->

<div
    id="chat-circle"
    onclick="toggleChat()"
>

    🤖

</div>

<!-- CHATBOX -->

<div
    id="chat-box"
    class="shadow"
>

    <!-- HEADER -->

    <div id="chat-header">

        <span>AI Voice Chatbot</span>

        <button
            onclick="toggleChat()"
            id="close-btn"
        >
            ✖
        </button>

    </div>

    <!-- BODY -->

    <div id="chat-body">

        <div class="bot-message">
            Hello 👋 Ask anything about the project.
        </div>

    </div>

    <!-- INPUT -->

    <div id="chat-input-area">

        <input
            type="text"
            id="query"
            placeholder="Ask something..."
        >

        <button onclick="sendMessage()">
            Send
        </button>

        <button onclick="startVoice()">
            🎤
        </button>

    </div>

</div>

<style>

#chat-circle{

    position: fixed;

    bottom: 20px;

    right: 20px;

    width: 65px;

    height: 65px;

    background: #0d6efd;

    color: white;

    border-radius: 50%;

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 30px;

    cursor: pointer;

    z-index: 9999;

    box-shadow: 0px 4px 15px rgba(0,0,0,0.3);
}

#chat-box{

    position: fixed;

    bottom: 100px;

    right: 20px;

    width: 350px;

    height: 500px;

    background: white;

    border-radius: 15px;

    display: none;

    flex-direction: column;

    overflow: hidden;

    z-index: 9999;
}

#chat-header{

    background: #0d6efd;

    color: white;

    padding: 15px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    font-weight: bold;
}

#close-btn{

    background: transparent;

    border: none;

    color: white;

    font-size: 18px;
}

#chat-body{

    flex: 1;

    padding: 15px;

    overflow-y: auto;

    background: #f8f9fa;
}

.bot-message{

    background: #e9ecef;

    padding: 10px;

    border-radius: 10px;

    margin-bottom: 10px;
}

.user-message{

    background: #0d6efd;

    color: white;

    padding: 10px;

    border-radius: 10px;

    margin-bottom: 10px;

    text-align: right;
}

#chat-input-area{

    display: flex;

    gap: 5px;

    padding: 10px;

    border-top: 1px solid #ddd;
}

#chat-input-area input{

    flex: 1;

    padding: 10px;

    border-radius: 10px;

    border: 1px solid #ccc;
}

#chat-input-area button{

    border: none;

    background: #0d6efd;

    color: white;

    padding: 10px 12px;

    border-radius: 10px;
}

</style>

<script>

function toggleChat(){

    let chatBox =
        document.getElementById("chat-box");

    if(chatBox.style.display === "flex"){

        chatBox.style.display = "none";

    }

    else{

        chatBox.style.display = "flex";
    }
}

function speakText(text){

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.lang = "en-US";

    window.speechSynthesis.speak(speech);
}

function appendMessage(message, type){

    let chatBody =
        document.getElementById("chat-body");

    let div =
        document.createElement("div");

    div.className =
        type === "user"
        ? "user-message"
        : "bot-message";

    div.innerHTML = message;

    chatBody.appendChild(div);

    chatBody.scrollTop =
        chatBody.scrollHeight;
}

function sendMessage(){

    let query =
        document.getElementById("query").value;

    if(query.trim() === "") return;

    appendMessage(query, "user");

    fetch(`/ai-chatbot/?query=${query}`)

    .then(response => response.json())

    .then(data => {

        appendMessage(data.response, "bot");

        speakText(data.response);

    });

    document.getElementById("query").value = "";
}

function startVoice(){

    const recognition =
        new webkitSpeechRecognition();

    recognition.lang = "en-US";

    recognition.start();

    recognition.onresult = function(event){

        const text =
            event.results[0][0].transcript;

        document.getElementById("query").value =
            text;

        sendMessage();
    };
}

</script>

{% endblock %}
