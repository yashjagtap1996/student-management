<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - job portal</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f6fa;
        }

        .navbar-brand {
            font-weight: bold;
        }

        .login-card {
            max-width: 500px;
            margin: auto;
            margin-top: 80px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            background: #fff;
        }

        .login-title {
            text-align: center;
            margin-bottom: 20px;
        }

        .btn-primary {
            border-radius: 6px;
            padding: 8px 20px;
        }

        .signup-link {
            text-align: center;
            margin-top: 15px;
        }

        .signup-link a {
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand text-primary" href="#">
            <i class="fa-solid fa-graduation-cap"></i> Job<span class="text-secondary">Portal</span>
        </a>

        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item mx-2">
                    <a class="nav-link" href="#"><i class="fa fa-home"></i> Home</a>
                </li>
                <li class="nav-item mx-2">
                    <a class="nav-link" href="#"><i class="fa fa-phone"></i> Contact</a>
                </li>
                <li class="nav-item mx-2">
                    <a class="nav-link" href="#"><i class="fa fa-bullhorn"></i> Notice</a>
                </li>
                <li class="nav-item mx-2">
                    <a class="nav-link text-dark" href="#">Login</a>
                </li>
                <li class="nav-item mx-2">
                    <a class="nav-link text-dark" href="#">SignUp</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Login Card -->
<div class="container">
    <div class="login-card">

        <h3 class="login-title">Login</h3>
        <hr>

        <form>
            <div class="mb-3">
                <label class="form-label">Username:</label>
                <input type="text" class="form-control" placeholder="Enter username">
            </div>

            <div class="mb-3">
                <label class="form-label">Password:</label>
                <input type="password" class="form-control" placeholder="Enter password">
            </div>

            <button type="submit" class="btn btn-primary">Login</button>
        </form>

        <div class="signup-link">
            <span class="text-primary">Existing User?</span>
            <a href="#" class="text-danger">Sign Up</a>
        </div>

    </div>
</div>

</body>
</html>
